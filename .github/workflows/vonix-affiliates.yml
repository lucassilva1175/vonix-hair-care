name: Vonix affiliates - verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vonix-affiliates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-api:
    name: Types, tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install from committed lockfile
        run: bun install --frozen-lockfile
      - name: Run all application tests
        run: bun run test
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Lint affiliate files only
        run: |
          bunx eslint \
            src/lib/affiliate-admin-session.server.ts \
            src/lib/affiliate-member-auth.server.ts \
            src/lib/affiliate-member-session.server.ts \
            src/lib/affiliate-invites.server.ts \
            src/lib/vonix-affiliate-auth.ts \
            src/lib/affiliate-admin-auth.server.ts \
            src/lib/affiliate-application.ts \
            src/lib/affiliate-applications.server.ts \
            src/lib/affiliate-database.server.ts \
            src/lib/affiliate-email.ts \
            src/lib/affiliate-functions.ts \
            src/lib/affiliate-throttle.server.ts \
            src/lib/affiliate-wizard.ts \
            src/lib/affiliate-wizard-crypto.server.ts \
            src/components/affiliate-wizard.tsx \
            src/components/affiliate-shell.tsx \
            src/test/affiliate-shell.test.tsx \
            src/components/affiliate-home-invite.tsx \
            src/test/affiliate-home-invite.test.tsx \
            src/routes/admin.afiliadas.tsx \
            src/routes/api.internal.affiliate-mail-worker.ts \
            src/routes/seja-afiliada.tsx \
            src/routes/acompanhar-inscricao.tsx \
            src/routes/acesso-equipe-afiliadas.tsx \
            src/test/affiliate-admin-session.test.ts \
            src/test/affiliate-invites.test.ts \
            src/test/affiliate-member-login.test.ts \
            src/test/affiliate-admin-auth.test.ts \
            src/test/affiliate-admin-ui.test.tsx \
            src/test/affiliate-database.test.ts \
            src/test/affiliate-readiness-script.test.ts \
            src/test/affiliate-recruitment.test.ts \
            src/test/affiliate-system.test.ts \
            src/test/affiliate-throttle.test.ts \
            src/test/affiliate-wizard.test.ts \
            src/test/affiliate-wizard-ui.test.tsx
      - name: Build full storefront
        run: bun run build

  isolated-postgres:
    name: Isolated PostgreSQL RLS, migration and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node for the concurrency fixture
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute database QA in disposable container without network
        shell: bash
        run: |
          set -euo pipefail
          # Synthetic QA credentials; there is no access to any real database.
          docker run --rm -d --name vonix-affiliates-sql-qa --network none \
            -e POSTGRES_PASSWORD=qa-disposable-only \
            -e POSTGRES_DB=vonix_affiliates_qa postgres:16
          trap 'docker stop vonix-affiliates-sql-qa >/dev/null 2>&1 || true' EXIT
          # pg_isready may succeed against Postgres' TEMPORARY init server
          # before POSTGRES_DB has been created. This caused intermittent
          # "database vonix_affiliates_qa does not exist" on main despite
          # a green PR. Wait for init completion AND a real SQL query.
          ready=0
          for attempt in $(seq 1 45); do
            if docker logs vonix-affiliates-sql-qa 2>&1 | grep -F 'PostgreSQL init process complete' >/dev/null \
              && docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 \
                   -U postgres -d vonix_affiliates_qa -Atc 'SELECT 1' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Disposable QA database did not finish initialization"
            docker logs --tail 60 vonix-affiliates-sql-qa
            exit 1
          fi
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;'
          docker cp supabase/vonix-affiliate-applications.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-applications.sql
          docker cp supabase/vonix-affiliate-qa.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-qa.sql
          docker cp supabase/vonix-affiliate-governance.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-governance.sql
          docker cp supabase/vonix-affiliate-governance-qa.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-governance-qa.sql
          # A mocked Supabase Auth schema exists ONLY in the disposable container.
          docker cp supabase/vonix-affiliate-auth-qa-scaffold.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-auth-qa-scaffold.sql
          docker cp supabase/vonix-affiliate-portal-status.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-portal-status.sql
          docker cp supabase/vonix-affiliate-admin-activation-guard-20261112.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-admin-activation-guard-20261112.sql
          docker cp supabase/vonix-affiliate-admin-activation-guard-qa-20261112.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-admin-activation-guard-qa-20261112.sql
          docker cp supabase/vonix-affiliate-verified-email-rls.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-verified-email-rls.sql
          docker cp supabase/vonix-affiliate-verified-email-rls-qa.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-verified-email-rls-qa.sql
          docker cp supabase/vonix-affiliate-simple-form-20261110.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-simple-form-20261110.sql
          docker cp supabase/vonix-affiliate-phone-only-portal-fix-20261111.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-phone-only-portal-fix-20261111.sql
          docker cp supabase/vonix-affiliate-phone-only-portal-qa-20261111.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-phone-only-portal-qa-20261111.sql
          docker cp supabase/vonix-affiliate-reapply-reasons-20261111.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-reapply-reasons-20261111.sql
          docker cp supabase/vonix-affiliate-reapply-reasons-qa-20261111.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-reapply-reasons-qa-20261111.sql
          docker cp supabase/vonix-affiliate-status-quota-20261111.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-status-quota-20261111.sql
          docker cp supabase/vonix-affiliate-status-quota-qa-20261111.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-status-quota-qa-20261111.sql
          docker cp supabase/vonix-affiliate-admin-social-search-20261113.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-admin-social-search-20261113.sql
          docker cp supabase/vonix-affiliate-admin-social-search-qa-20261113.sql vonix-affiliates-sql-qa:/tmp/vonix-affiliate-admin-social-search-qa-20261113.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-applications.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-qa.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-governance.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-governance-qa.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-auth-qa-scaffold.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-portal-status.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-admin-activation-guard-20261112.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-verified-email-rls.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-verified-email-rls-qa.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-simple-form-20261110.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-phone-only-portal-fix-20261111.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-phone-only-portal-qa-20261111.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-reapply-reasons-20261111.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-reapply-reasons-qa-20261111.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-status-quota-20261111.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-status-quota-qa-20261111.sql

          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-admin-activation-guard-qa-20261112.sql
          # C26: social handle search for email-less applicants, no network or real accounts.
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-admin-social-search-20261113.sql
          docker exec vonix-affiliates-sql-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d vonix_affiliates_qa \
            -f /tmp/vonix-affiliate-admin-social-search-qa-20261113.sql
          node scripts/qa-affiliate-concurrency.mjs
